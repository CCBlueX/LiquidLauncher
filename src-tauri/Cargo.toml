[package]
name = "liquidlauncher"
version = "0.5.0"
description = "A LiquidBounce launcher for Minecraft, written in Rust using Tauri."
authors = ["Izuna <izuna.seikatsu@ccbluex.net>", "superblaubeere27"]
license = "GNU General Public License v3.0"
homepage = "https://liquidbounce.net/"
repository = "https://github.com/CCBlueX/LiquidLauncher"
edition = "2021"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
# Log
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["fmt", "env-filter"] }
tracing-appender = "^0.2"

# Async IO
tokio = { version = "^1", features = ["full"] }
tokio-util = { version = "^0.7", features = ["compat"] }
futures = "^0.3"

# Error handling
anyhow = "^1.0"
thiserror = "^2.0"
backon = { version = "^1.6.0", default-features = false, features = ["tokio-sleep"] }

# Generic
void = "^1"
directories = "^6.0.0"
once_cell = "^1.16.0"

# FS libs
async_zip = { version = "^0.0.18", features = ["full"] }
tokio-tar = "^0.3.1"
async-compression = { version= "^0.4.43", features = ["gzip"] }
sanitize-filename = "0.6.0"
path-absolutize = "^4.0.1"

# OS
os_info = "3"
sysinfo = "^0.39.6"

# Data
regex = "1.7.0"
uuid = { version = "1.2", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "^0.10.2"
md5 = "^0.8.1"
sha1 = "^0.11.0"
base16ct = { version = "^1.0.0", features = ["alloc"] }

# UI library
tauri = { version = "^2", features = [] }
tauri-plugin-process = "^2"
tauri-plugin-dialog = "^2"
tauri-plugin-opener = "^2"
tauri-plugin-updater = "^2"
tauri-plugin-clipboard-manager = "^2"

# Client libs
reqwest = { version = "0.13.1", default-features = false, features = ["http2", "charset", "rustls", "system-proxy", "gzip", "json"] }
# oauth2 5.0.0 does not support reqwest 0.13 (10.08.2026 and still waiting)
oauth2 = { git = "https://github.com/martijnberger/oauth2-rs.git", default-features = false, features = ["reqwest", "rustls"] }
azalea-auth = "0.16.0"

# Data serialization libs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
strip = true
lto = true
codegen-units = 1
